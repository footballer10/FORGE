name = "forge-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Create the database once:  npx wrangler d1 create forge
# then paste the database_id it prints below (this is the owner's database; not a secret: it only works with their Cloudflare login).
[[d1_databases]]
binding = "DB"
database_name = "forge"
database_id = "ebf4d4e7-0bf7-4d4e-9e72-c1923458661a"

# Set the secret once:  npx wrangler secret put SYNC_TOKEN   (use a long random string)

# Lock-screen rest alerts (milestone 17): one Durable Object holds the push subscription and fires the alarm.
# Generate the keys with  node scripts/vapid-keys.mjs  and set VAPID_PUBLIC and VAPID_PRIVATE as secrets.
# Optional: set VAPID_SUBJECT (a mailto: or https: contact) as a var; by default the Worker's own address is used.
[[durable_objects.bindings]]
name = "REST"
class_name = "RestAlarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestAlarm"]

# Weekly email (Sunday summary). Runs Monday 01:00 UTC = Sunday evening in the US and reports Monday–Sunday.
# Free Resend account (resend.com): create an API key, then
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put EMAIL_TO        (the email address you signed up to Resend with)
# Without a verified domain Resend only delivers to that sign-up address, which is all a one-person app needs.
[triggers]
crons = ["0 1 * * 1"]
