<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2e1210"/>
      <stop offset="0.5" stop-color="#140c0b"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc35a"/>
      <stop offset="0.5" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#d7261e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- glowing barbell on the anvil -->
  <g filter="url(#glow)">
    <rect x="112" y="226" width="288" height="12" rx="6" fill="url(#hot)"/>
    <rect x="132" y="196" width="22" height="72" rx="5" fill="#d7261e"/>
    <rect x="358" y="196" width="22" height="72" rx="5" fill="#d7261e"/>
    <rect x="114" y="208" width="16" height="48" rx="4" fill="#d7261e"/>
    <rect x="382" y="208" width="16" height="48" rx="4" fill="#d7261e"/>
  </g>
  <!-- anvil -->
  <path d="M96 272 H404 V300 Q404 312 392 312 H330 Q310 312 306 330 L300 352 H340 Q352 352 352 364 V388 H160 V364 Q160 352 172 352 H212 L206 330 Q202 312 182 312 H150 Q118 312 96 272 Z" fill="#f2f0ec"/>
  <!-- sparks -->
  <g stroke-linecap="round" fill="none">
    <path d="M256 186 L256 150" stroke="#ffc35a" stroke-width="8"/>
    <path d="M226 190 L206 160" stroke="#ff8a2a" stroke-width="7"/>
    <path d="M286 190 L306 160" stroke="#ff8a2a" stroke-width="7"/>
  </g>
  <circle cx="256" cy="132" r="6" fill="#ffc35a"/>
</svg>
